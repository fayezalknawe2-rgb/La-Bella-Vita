  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>La Bella Vita</h1>
    <p class="slogan">Fine Italian Dining</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>

        <li><a href="media.html">Video &amp; Audio</a></li>
        <li><a href="booking.html" class="active">Book a Table</a></li>
      </ul>
    </nav>
  </header>

  <main class="booking-main">
    <section>
      <div class="section-header">
        <span>Reservations</span>
        <h2>Reserve Your Table</h2>
        <div class="divider"></div>
      </div>

      <div class="booking-card">
        <form action="#" method="post">
          <div class="form-grid">

            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your full name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
              <label for="phone">Mobile number</label>
              <input type="tel" id="phone" name="phone" placeholder="01000000000">
            </div>

            <div class="form-group">
              <label for="people">Number of guests</label>
              <select id="people" name="people">
                <option value="2">2 Guests</option>
                <option value="4">4 Guests</option>
                <option value="6">6 Guests</option>
                <option value="8">8 Guests</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" name="date">
            </div>

            <div class="form-group">
              <label for="time">Time</label>
              <input type="time" id="time" name="time">
            </div>

            <div class="form-group full-width">
              <span class="group-label">Seating area</span>
              <div class="options-row">
                <label class="option-pill">
                  <input type="radio" id="in" name="place" value="in" checked>
                  <span>Indoor hall</span>
                </label>
                <label class="option-pill">
                  <input type="radio" id="terrace" name="place" value="terrace">
                  <span>Terrace</span>
                </label>
                <label class="option-pill">
                  <input type="radio" id="vip" name="place" value="vip">
                  <span>VIP room</span>
                </label>
              </div>
            </div>

            <div class="form-group full-width">
              <span class="group-label">Occasion</span>
              <div class="options-row">
                <label class="option-pill">
                  <input type="checkbox" id="birthday" name="occasion" value="birthday">
                  <span>Birthday</span>
                </label>
                <label class="option-pill">
                  <input type="checkbox" id="anniv" name="occasion" value="anniversary">
                  <span>Anniversary</span>
                </label>
              </div>
            </div>

            <div class="form-group full-width">
              <label for="notes">Notes</label>
              <textarea id="notes" name="notes" rows="4" cols="40" placeholder="Any dietary requests, allergies, or seating preferences..."></textarea>
            </div>

          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Confirm Booking</button>
            <button type="reset" class="btn-reset">Clear</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 La Bella Vita &mdash; Fine Italian Dining</p>
    <p>
      <a href="mailto:info@example.com">info@example.com</a> |
      <a href="tel:+201000000000">01094275944</a>
    </p>
  </footer>

</body>
</html>
